#EcoScan - local infrastructure. the API and the worker run on our machine
#with npm (see README); they join this file at the deployment step.
name: ecoscan

services:
  redis:
   image: redis:7-alpine
   restart: unless-stopped
   #appendonly: every write is saved to disk, so counters survive a restart
   command: ["redis-server", "--appendonly", "yes"]
   ports:
    - "127.0.0.1:6380:6379" #localhost only : Redis is never exposed on the network
   volumes:
     - redis-data:/data
   healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10
    
volumes: 
  redis-data:
